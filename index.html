<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>うちゅうスマッシュ！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  h1 {
    color: #ffe44d;
    text-shadow: 0 0 20px #ff8c00, 3px 3px 0 #ff4081;
    font-size: 36px;
    margin-bottom: 10px;
    letter-spacing: 4px;
  }
  #gameContainer {
    position: relative;
    border: 4px solid #4a90ff;
    border-radius: 12px;
    box-shadow: 0 0 40px #4a90ff, inset 0 0 30px rgba(74, 144, 255, 0.3);
  }
  canvas {
    display: block;
    background: #000010;
    border-radius: 8px;
  }
  #info {
    margin-top: 12px;
    font-size: 14px;
    color: #aaccff;
    text-align: center;
    line-height: 1.6;
  }
  .key {
    display: inline-block;
    background: #333;
    padding: 2px 10px;
    border-radius: 6px;
    border: 2px solid #666;
    margin: 0 2px;
    font-weight: bold;
    color: #fff;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 30, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    z-index: 10;
  }
  #overlay h2 {
    font-size: 48px;
    color: #ffe44d;
    text-shadow: 3px 3px 0 #ff4081;
    margin-bottom: 20px;
  }
  #overlay button {
    font-size: 24px;
    padding: 12px 32px;
    background: #ff4081;
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    box-shadow: 0 4px 0 #b71c4a;
    transition: transform 0.1s;
  }
  #overlay button:hover {
    transform: translateY(-2px);
  }
  #overlay button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #b71c4a;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>★ うちゅうスマッシュ ★</h1>
<div id="gameContainer">
  <canvas id="game" width="900" height="540"></canvas>
  <div id="overlay">
    <h2 id="title">うちゅうスマッシュ！</h2>
    <p id="subtitle" style="margin-bottom: 24px; font-size: 18px;">てきを たおすほど つよい てきが でてくるぞ！</p>
    <button id="startBtn">スタート</button>
  </div>
</div>
<div id="info">
  <strong>うごく:</strong> <span class="key">←</span><span class="key">→</span>
  <strong>ジャンプ:</strong> <span class="key">↑</span> または <span class="key">スペース</span>
  <strong>こうげき:</strong> <span class="key">Z</span>
  <strong>つよいこうげき:</strong> <span class="key">X</span>
  <strong>ぼうぎょ:</strong> <span class="key">↓</span><br>
  ※ ステージから おちたら まけ！ ダメージが おおいほど とおくに ふきとぶよ！<br>
  ★ てきを たおすと どんどん つよい てきが でてくる！ どこまで いける？
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ステージ
const stage = { x: 150, y: 380, w: 600, h: 30 };

// 星の背景
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.8 + 0.3,
    tw: Math.random() * Math.PI * 2
  });
}
// 遠くの惑星
const planets = [
  { x: 120, y: 100, r: 40, c1: '#ff8c00', c2: '#ff4081' },
  { x: 760, y: 80, r: 25, c1: '#7c4dff', c2: '#3949ab' },
  { x: 700, y: 200, r: 15, c1: '#4dd0e1', c2: '#01579b' }
];

// ステージリスト（ウェーブごとに切り替わる）
const stages = [
  { type: 'space',  name: 'うちゅう' },
  { type: 'magma',  name: 'マグマ' },
  { type: 'ship',   name: 'うみのうえ' },
  { type: 'cave',   name: 'どうくつ' },
  { type: 'castle', name: 'おしろ' },
];
let currentStage = stages[0];
let bgParticles = [];

function setStageForWave(w) {
  currentStage = stages[(w - 1) % stages.length];
  bgParticles = [];
}

// ウェーブ表（倒すごとに強い敵がでる！）
const waveTable = [
  { type: 'alien',     name: 'エイリアン',       color: '#7ed957', size: 1.0 },
  { type: 'alien_red', name: 'あかエイリアン',   color: '#ff6b6b', size: 1.0 },
  { type: 'robot',     name: 'うちゅうロボ',     color: '#aab8d6', size: 1.1 },
  { type: 'ghost',     name: 'ゆうれい',         color: '#e0c8ff', size: 1.0 },
  { type: 'boss',      name: 'まおう',           color: '#b03060', size: 1.5 },
];

function getWaveConfig(wave) {
  const idx = Math.min(wave - 1, waveTable.length - 1);
  const base = waveTable[idx];
  const extra = Math.max(0, wave - waveTable.length);
  const lvSuffix = extra > 0 ? ' Lv.' + (extra + 1) : '';
  return {
    type: base.type,
    name: base.name + lvSuffix,
    color: base.color,
    size: base.size,
    speedMul: 1 + (wave - 1) * 0.07,
    dmgMul: 1 + (wave - 1) * 0.08,
    kbMul: 1 + (wave - 1) * 0.05,
    aiCool: Math.max(0.35, 1 - (wave - 1) * 0.08), // 小さいほど判断はやい
    aggression: Math.min(0.9, 0.5 + (wave - 1) * 0.06), // 攻撃よりにかたよる
    lives: base.type === 'boss' ? 2 + Math.floor(extra / 2) : 1,
  };
}

// キャラクター作成
function makeFighter(opts) {
  const size = opts.size || 1.0;
  return {
    name: opts.name,
    color: opts.color,
    eyeColor: opts.eyeColor || '#fff',
    type: opts.type, // 'astronaut' | 'alien' | 'alien_red' | 'robot' | 'ghost' | 'boss'
    x: opts.x,
    y: opts.y,
    vx: 0,
    vy: 0,
    size: size,
    w: 50 * size,
    h: 70 * size,
    facing: opts.facing, // 1 or -1
    onGround: false,
    damage: 0, // %
    attackCooldown: 0,
    attackBox: null, // {x, y, w, h, dmg, kb, life}
    hitstun: 0,
    isCPU: opts.isCPU || false,
    cpuTimer: 0,
    cpuAction: 'idle',
    lives: opts.lives != null ? opts.lives : 3,
    flashTimer: 0,
    walkAnim: 0,
    // ウェーブ用ステータス倍率（既定は1.0）
    speedMul: opts.speedMul || 1.0,
    dmgMul: opts.dmgMul || 1.0,
    kbMul: opts.kbMul || 1.0,
    aiCool: opts.aiCool || 1.0,
    aggression: opts.aggression != null ? opts.aggression : 0.5,
    // 防御
    shielding: false,
    shieldMeter: 100, // 0-100
    shieldBroken: 0,  // 残りスタンフレーム
  };
}

let p1, p2, gameState, winner, particles, announceText, announceTimer;
let wave, score, waveTransitionTimer;

function spawnEnemy(waveNum) {
  const c = getWaveConfig(waveNum);
  return makeFighter({
    name: c.name,
    color: c.color,
    type: c.type,
    size: c.size,
    x: stage.x + stage.w * 0.7,
    y: 100,
    facing: -1,
    isCPU: true,
    lives: c.lives,
    speedMul: c.speedMul,
    dmgMul: c.dmgMul,
    kbMul: c.kbMul,
    aiCool: c.aiCool,
    aggression: c.aggression,
  });
}

function resetGame() {
  wave = 1;
  score = 0;
  waveTransitionTimer = 0;
  setStageForWave(wave);
  p1 = makeFighter({
    name: 'うちゅうひこうし',
    color: '#4a90ff',
    eyeColor: '#fff',
    type: 'astronaut',
    x: 300, y: 300,
    facing: 1,
    isCPU: false,
    lives: 3
  });
  p2 = spawnEnemy(wave);
  particles = [];
  winner = null;
  announceText = '';
  announceTimer = 0;
  announce('WAVE 1  ' + currentStage.name + '  ' + p2.name + '!', 100);
  gameState = 'play';
}

function nextWave() {
  wave++;
  score++;
  setStageForWave(wave);
  // 3ウェーブごとに残機ボーナス（最大5）
  if (wave % 3 === 1 && p1.lives < 5) p1.lives++;
  // プレイヤーは回復＋無敵
  p1.damage = 0;
  p1.hitstun = 20;
  p1.flashTimer = 90;
  p1.x = stage.x + stage.w * 0.3;
  p1.y = 200;
  p1.vx = 0; p1.vy = 0;
  p2 = spawnEnemy(wave);
  announce('WAVE ' + wave + '  ' + currentStage.name + '  ' + p2.name + '!', 100);
}

// 入力
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  // ジャンプとアタックは押した瞬間判定（防御中は不可）
  if (gameState === 'play' && !p1.hitstun && !p1.shielding) {
    if ((e.key === 'ArrowUp' || e.key === ' ') && p1.onGround) {
      p1.vy = -13;
      p1.onGround = false;
    }
    if (e.key.toLowerCase() === 'z' && p1.attackCooldown <= 0) {
      doAttack(p1, false);
    }
    if (e.key.toLowerCase() === 'x' && p1.attackCooldown <= 0) {
      doAttack(p1, true);
    }
  }
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function doAttack(f, strong) {
  const range = (strong ? 60 : 45) * f.size;
  const dmg = (strong ? 15 : 7) * f.dmgMul;
  const kb = (strong ? 8 : 4) * f.kbMul;
  f.attackBox = {
    x: f.x + (f.facing === 1 ? f.w/2 : -f.w/2 - range),
    y: f.y - f.h/2 - 5,
    w: range,
    h: f.h * 0.7,
    dmg: dmg,
    kb: kb,
    strong: strong,
    life: strong ? 14 : 8,
    owner: f
  };
  f.attackCooldown = strong ? 35 : 18;
}

// CPU AI（ウェーブが進むほど反応が速くなる）
function updateCPU(cpu, target) {
  if (cpu.hitstun > 0) return;
  cpu.cpuTimer--;

  const dx = target.x - cpu.x;
  const adx = Math.abs(dx);
  const dy = target.y - cpu.y;
  const accel = 0.3 * cpu.speedMul;
  const reach = 65 * cpu.size;

  // 落下回避：ステージから外れそうなら戻る
  const onStage = cpu.x > stage.x + 10 && cpu.x < stage.x + stage.w - 10;
  if (!onStage && cpu.y < stage.y) {
    const center = stage.x + stage.w/2;
    cpu.vx += (center - cpu.x) > 0 ? accel + 0.1 : -(accel + 0.1);
    if (cpu.onGround) { cpu.vy = -13; cpu.onGround = false; }
    cpu.facing = (center - cpu.x) > 0 ? 1 : -1;
    return;
  }

  if (cpu.cpuTimer <= 0) {
    cpu.cpuTimer = (30 + Math.random() * 50) * cpu.aiCool;
    if (adx < reach + 10) {
      cpu.cpuAction = Math.random() < cpu.aggression ? 'attack' : 'back';
    } else if (adx < 250) {
      cpu.cpuAction = Math.random() < (0.4 + cpu.aggression * 0.4) ? 'approach' : 'wait';
    } else {
      cpu.cpuAction = 'approach';
    }
  }

  cpu.facing = dx > 0 ? 1 : -1;

  if (cpu.cpuAction === 'approach') {
    cpu.vx += (dx > 0 ? accel : -accel);
    // たまにジャンプ（強いほどよくジャンプ）
    const jumpChance = 0.015 + (cpu.speedMul - 1) * 0.04;
    if (cpu.onGround && Math.random() < jumpChance && dy < -20) {
      cpu.vy = -13;
      cpu.onGround = false;
    }
  } else if (cpu.cpuAction === 'back') {
    cpu.vx += (dx > 0 ? -accel : accel);
  } else if (cpu.cpuAction === 'attack') {
    if (cpu.attackCooldown <= 0 && adx < reach) {
      // ウェーブが上がるほど強攻撃の頻度UP
      const strongChance = Math.min(0.6, 0.2 + (cpu.dmgMul - 1) * 0.8);
      doAttack(cpu, Math.random() < strongChance);
    }
  }
}

function update() {
  if (gameState !== 'play') return;

  // 星のキラキラ
  stars.forEach(s => s.tw += 0.05);

  // P1 シールド入力（地上のみ・スタン中不可）
  const wantShield = !!keys['arrowdown'];
  if (p1.hitstun <= 0 && p1.shieldBroken <= 0 && p1.onGround && wantShield && p1.shieldMeter > 5) {
    p1.shielding = true;
  } else {
    p1.shielding = false;
  }

  // P1 入力（防御中は移動できない）
  if (p1.hitstun <= 0 && !p1.shielding) {
    if (keys['arrowleft']) { p1.vx -= 0.6 * p1.speedMul; p1.facing = -1; }
    if (keys['arrowright']) { p1.vx += 0.6 * p1.speedMul; p1.facing = 1; }
  }

  // シールドゲージ更新（両者共通：CPUは shielding=false 固定なので回復のみ）
  [p1, p2].forEach(f => {
    if (f.shielding) {
      f.shieldMeter = Math.max(0, f.shieldMeter - 0.6);
      if (f.shieldMeter <= 0) {
        f.shielding = false;
        f.shieldBroken = 60;
        f.hitstun = 60;
        if (f === p1) announce('シールドこわれた！', 50);
      }
    } else {
      f.shieldMeter = Math.min(100, f.shieldMeter + 0.4);
      if (f.shieldBroken > 0) f.shieldBroken--;
    }
  });

  // CPU
  updateCPU(p2, p1);

  [p1, p2].forEach(f => {
    // 摩擦
    f.vx *= 0.85;
    const maxVx = 8 * f.speedMul;
    if (Math.abs(f.vx) > maxVx) f.vx = Math.sign(f.vx) * maxVx;
    // 重力（ゆうれいは少しふんわり）
    const gravity = f.type === 'ghost' ? 0.45 : 0.6;
    f.vy += gravity;
    if (f.vy > 14) f.vy = 14;

    f.x += f.vx;
    f.y += f.vy;

    // ステージ着地判定
    const feetY = f.y;
    const onTopOfStage =
      f.x > stage.x && f.x < stage.x + stage.w &&
      feetY >= stage.y && feetY <= stage.y + 20 &&
      f.vy >= 0;
    if (onTopOfStage) {
      f.y = stage.y;
      f.vy = 0;
      f.onGround = true;
    } else {
      f.onGround = false;
    }

    // 歩きアニメ
    if (f.onGround && Math.abs(f.vx) > 0.5) f.walkAnim += 0.3;

    if (f.attackCooldown > 0) f.attackCooldown--;
    if (f.hitstun > 0) f.hitstun--;
    if (f.flashTimer > 0) f.flashTimer--;

    // 攻撃判定の寿命
    if (f.attackBox) {
      f.attackBox.life--;
      // 攻撃ボックスをキャラについていかせる
      f.attackBox.x = f.x + (f.facing === 1 ? f.w/2 : -f.w/2 - f.attackBox.w);
      f.attackBox.y = f.y - f.h/2 - 5;
      if (f.attackBox.life <= 0) f.attackBox = null;
    }
  });

  // 攻撃ヒット判定
  checkHit(p1, p2);
  checkHit(p2, p1);

  // 落下判定（画面外）
  [p1, p2].forEach(f => {
    if (f.y > H + 100 || f.x < -100 || f.x > W + 100 || f.y < -200) {
      f.lives--;
      // 爆発パーティクル
      explode(Math.max(20, Math.min(W-20, f.x)), Math.max(20, Math.min(H-20, f.y)), f.color);
      if (f === p2) {
        // 敵を倒した
        if (f.lives <= 0) {
          // ウェーブクリア → つぎの敵
          nextWave();
        } else {
          // ボスなど複数機：その場で復活
          f.x = stage.x + stage.w * 0.7;
          f.y = 100;
          f.vx = 0; f.vy = 0;
          f.damage = 0;
          f.hitstun = 30;
          f.flashTimer = 60;
          announce(f.name + ' まだまだ！', 50);
        }
      } else {
        // プレイヤー落下
        if (f.lives <= 0) {
          winner = p2;
          gameState = 'over';
        } else {
          f.x = stage.x + stage.w/2 - 80;
          f.y = 100;
          f.vx = 0; f.vy = 0;
          f.damage = 0;
          f.hitstun = 30;
          f.flashTimer = 60;
          announce(f.name + ' ふっかつ！', 60);
        }
      }
    }
  });

  // パーティクル
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  // 背景パーティクル（ステージごと）
  spawnBgParticles();
  updateBgParticles();

  if (announceTimer > 0) announceTimer--;
}

function checkHit(attacker, defender) {
  if (!attacker.attackBox) return;
  if (defender.flashTimer > 0) return; // 復活直後の無敵
  const a = attacker.attackBox;
  const dLeft = defender.x - defender.w/2;
  const dRight = defender.x + defender.w/2;
  const dTop = defender.y - defender.h;
  const dBot = defender.y;
  if (a.x < dRight && a.x + a.w > dLeft && a.y < dBot && a.y + a.h > dTop) {
    if (defender.shielding) {
      // 防御！ ダメージ・ノックバック大幅軽減
      defender.damage += a.dmg * 0.25;
      const kbForce = (a.kb + defender.damage * 0.04) * 0.25;
      defender.vx = attacker.facing * kbForce;
      defender.vy = -kbForce * 0.4;
      defender.hitstun = 8;
      defender.shieldMeter = Math.max(0, defender.shieldMeter - (a.strong ? 35 : 20));
      attacker.attackBox = null;
      // ガードエフェクト（青）
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: defender.x,
          y: defender.y - defender.h/2,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 1,
          life: 18 + Math.random() * 8,
          color: '#7ec8ff',
          r: 2 + Math.random() * 2
        });
      }
      shake = 3;
      // ガード中にメーター切れたらブレイク
      if (defender.shieldMeter <= 0) {
        defender.shielding = false;
        defender.shieldBroken = 60;
        defender.hitstun = 60;
        if (defender === p1) announce('シールドこわれた！', 50);
      }
      return;
    }
    // 通常ヒット
    defender.damage += a.dmg;
    const kbForce = a.kb + defender.damage * 0.08;
    defender.vx = attacker.facing * kbForce;
    defender.vy = -kbForce * 0.7 - 2;
    defender.hitstun = a.strong ? 25 : 12;
    attacker.attackBox = null;
    // ヒットエフェクト
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: defender.x,
        y: defender.y - defender.h/2,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 2,
        life: 25 + Math.random() * 10,
        color: a.strong ? '#ff4081' : '#ffe44d',
        r: 3 + Math.random() * 3
      });
    }
    if (a.strong) {
      shake = 10;
    } else {
      shake = 4;
    }
  }
}

function explode(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      life: 40 + Math.random() * 20,
      color: i % 2 === 0 ? color : '#ffe44d',
      r: 3 + Math.random() * 4
    });
  }
  shake = 15;
}

function announce(text, time) {
  announceText = text;
  announceTimer = time;
}

// ─── 背景パーティクル（ステージ別アンビエント） ───
function spawnBgParticles() {
  const t = currentStage.type;
  if (t === 'magma') {
    if (Math.random() < 0.35) {
      bgParticles.push({
        x: Math.random() * W, y: H + 5,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -1 - Math.random() * 1.5,
        life: 80 + Math.random() * 50,
        color: ['#ff6b00', '#ffe44d', '#ff4081'][Math.floor(Math.random()*3)],
        r: 1.5 + Math.random() * 2
      });
    }
  } else if (t === 'ship') {
    if (Math.random() < 0.06) {
      bgParticles.push({
        x: Math.random() * W,
        y: H - 90 + Math.random() * 30,
        vx: (Math.random() - 0.5) * 1.2,
        vy: -2 - Math.random() * 1.5,
        life: 25 + Math.random() * 15,
        color: '#fff', r: 2 + Math.random() * 1.5
      });
    }
  } else if (t === 'cave') {
    if (Math.random() < 0.07) {
      bgParticles.push({
        x: 40 + Math.random() * (W - 80),
        y: 30 + Math.random() * 80,
        vx: 0, vy: 0.6 + Math.random() * 0.4,
        life: 200, color: '#7ec8ff', r: 1.5
      });
    }
  } else if (t === 'castle') {
    if (Math.random() < 0.04) {
      bgParticles.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.5,
        vx: 0, vy: 0,
        life: 50 + Math.random() * 40,
        color: '#fff', r: 1 + Math.random() * 1.2
      });
    }
  }
}

function updateBgParticles() {
  bgParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  bgParticles = bgParticles.filter(p => p.life > 0 && p.y > -20 && p.y < H + 20);
}

function drawBgParticles() {
  bgParticles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ─── 背景描画（ステージ別） ───
function drawBackground() {
  switch (currentStage.type) {
    case 'space':  drawBgSpace();  break;
    case 'magma':  drawBgMagma();  break;
    case 'ship':   drawBgShip();   break;
    case 'cave':   drawBgCave();   break;
    case 'castle': drawBgCastle(); break;
  }
}

function drawBgSpace() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a3a');
  grad.addColorStop(1, '#000010');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // 星
  stars.forEach(s => {
    ctx.globalAlpha = 0.5 + Math.sin(s.tw) * 0.4;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  // 惑星
  planets.forEach(pl => {
    const g = ctx.createRadialGradient(pl.x - pl.r/3, pl.y - pl.r/3, 1, pl.x, pl.y, pl.r);
    g.addColorStop(0, pl.c1);
    g.addColorStop(1, pl.c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pl.x, pl.y, pl.r, 0, Math.PI * 2);
    ctx.fill();
    if (pl === planets[0]) {
      ctx.strokeStyle = 'rgba(255, 200, 100, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(pl.x, pl.y, pl.r * 1.6, pl.r * 0.4, -0.3, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
}

function drawBgMagma() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a0000');
  grad.addColorStop(0.6, '#3a0a08');
  grad.addColorStop(1, '#7a1010');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // とおくの火山（シルエット）
  ctx.fillStyle = '#1a0a08';
  const peaks = [50,360, 130,300, 220,340, 320,290, 420,330, 520,300, 640,270, 740,320, 850,290];
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, 360);
  for (let i = 0; i < peaks.length; i += 2) ctx.lineTo(peaks[i], peaks[i+1]);
  ctx.lineTo(W, 350);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // 火山口の光
  ctx.fillStyle = '#ff6b00';
  ctx.beginPath();
  ctx.arc(220, 340, 4, 0, Math.PI * 2);
  ctx.arc(420, 330, 5, 0, Math.PI * 2);
  ctx.arc(640, 270, 4, 0, Math.PI * 2);
  ctx.fill();

  // 下のマグマ
  const lava = ctx.createLinearGradient(0, H - 80, 0, H);
  lava.addColorStop(0, '#ff4500');
  lava.addColorStop(0.6, '#ff8800');
  lava.addColorStop(1, '#a00000');
  ctx.fillStyle = lava;
  ctx.fillRect(0, H - 80, W, 80);
  // マグマの上面の光
  ctx.fillStyle = 'rgba(255, 220, 100, 0.4)';
  ctx.fillRect(0, H - 84, W, 6);
}

function drawBgShip() {
  // 空（昼）
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#7ec8e3');
  grad.addColorStop(0.5, '#bae3f0');
  grad.addColorStop(0.8, '#f8e8a0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // たいよう
  ctx.fillStyle = 'rgba(255, 228, 77, 0.4)';
  ctx.beginPath();
  ctx.arc(740, 130, 56, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff8a0';
  ctx.beginPath();
  ctx.arc(740, 130, 36, 0, Math.PI * 2);
  ctx.fill();

  // 雲
  drawCloud(140, 90, 1.0);
  drawCloud(380, 60, 0.8);
  drawCloud(560, 130, 1.1);

  // うみ
  const sea = ctx.createLinearGradient(0, H - 110, 0, H);
  sea.addColorStop(0, '#3a8ec0');
  sea.addColorStop(1, '#0a2a60');
  ctx.fillStyle = sea;
  ctx.fillRect(0, H - 110, W, 110);

  // なみ
  const t = performance.now() * 0.002;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  for (let layer = 0; layer < 3; layer++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = H - 100 + layer * 28 + Math.sin(x * 0.03 + t + layer * 0.7) * 4;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 18 * s, y - 4, 26 * s, 0, Math.PI * 2);
  ctx.arc(x + 38 * s, y, 22 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawBgCave() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a1410');
  grad.addColorStop(1, '#0a0808');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // しょうにゅうせき
  ctx.fillStyle = '#3a2e22';
  for (let i = 0; i < 12; i++) {
    const x = i * 80 + 40;
    const w = 26 + (i % 3) * 10;
    const h = 35 + ((i * 7) % 50);
    ctx.beginPath();
    ctx.moveTo(x - w/2, 0);
    ctx.lineTo(x + w/2, 0);
    ctx.lineTo(x, h);
    ctx.closePath();
    ctx.fill();
  }

  // ひかるクリスタル
  const crystals = [
    {x:60,  y:220, c:'#ff7eb6'},
    {x:830, y:240, c:'#7ec8ff'},
    {x:30,  y:480, c:'#7ec8ff'},
    {x:870, y:470, c:'#a0ff80'},
    {x:450, y:500, c:'#ff7eb6'},
  ];
  crystals.forEach(c => drawCrystal(c.x, c.y, c.c));

  // ゆか
  ctx.fillStyle = '#0a0606';
  ctx.fillRect(0, H - 50, W, 50);
}

function drawCrystal(x, y, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.shadowBlur = 18;
  ctx.shadowColor = color;
  ctx.beginPath();
  ctx.moveTo(x, y - 14);
  ctx.lineTo(x + 7, y);
  ctx.lineTo(x, y + 14);
  ctx.lineTo(x - 7, y);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

  ctx.lineTo(500, 200);
  ctx.lineTo(500, 350);
  ctx.lineTo(680, 350);

  ctx.lineTo(720, 280);

// ─── ステージ（足場）描画 ───
function drawStagePlatform() {
  switch (currentStage.type) {
    case 'space':  drawStageSpace();  break;
    case 'magma':  drawStageMagma();  break;
    case 'ship':   drawStageShip();   break;
    case 'cave':   drawStageCave();   break;
    case 'castle': drawStageCastle(); break;
  }
}

function drawStageSpace() {
  const sg = ctx.createLinearGradient(0, stage.y, 0, stage.y + stage.h);
  sg.addColorStop(0, '#aab8d6');
  sg.addColorStop(0.5, '#5a6a99');
  sg.addColorStop(1, '#2a3550');
  ctx.fillStyle = sg;
  ctx.fillRect(stage.x, stage.y, stage.w, stage.h);
  ctx.fillStyle = '#ffe44d';
  ctx.fillRect(stage.x, stage.y, stage.w, 4);
  ctx.fillStyle = '#1a2030';
  for (let i = 0; i < 8; i++) ctx.fillRect(stage.x + 30 + i * 70, stage.y + stage.h - 8, 40, 4);
  ctx.fillStyle = 'rgba(74, 144, 255, 0.3)';
  ctx.fillRect(stage.x, stage.y + stage.h, stage.w, 30);
}

function drawStageMagma() {
  const sg = ctx.createLinearGradient(0, stage.y, 0, stage.y + stage.h);
  sg.addColorStop(0, '#5a4030');
  sg.addColorStop(0.5, '#3a2010');
  sg.addColorStop(1, '#1a0808');
  ctx.fillStyle = sg;
  ctx.fillRect(stage.x, stage.y, stage.w, stage.h);
  // ごつごつした上面
  ctx.fillStyle = '#7a5040';
  ctx.fillRect(stage.x, stage.y, stage.w, 4);
  for (let i = 0; i < 18; i++) {
    ctx.fillRect(stage.x + i * 33 + (i % 2) * 8, stage.y - 2, 18, 4);
  }

  ctx.fillStyle = '#ff4500';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(stage.x + 25 + i * 70, stage.y + stage.h - 6, 45, 3);
  }
  ctx.fillStyle = 'rgba(255, 100, 0, 0.4)';
  ctx.fillRect(stage.x, stage.y + stage.h, stage.w, 30);
}

function drawStageShip() {
  // 木のデッキ
  const sg = ctx.createLinearGradient(0, stage.y, 0, stage.y + stage.h);
  sg.addColorStop(0, '#a8702a');
  sg.addColorStop(1, '#5a3a18');
  ctx.fillStyle = sg;
  ctx.fillRect(stage.x, stage.y, stage.w, stage.h);
  // いたの線
  ctx.strokeStyle = '#3a2010';
  ctx.lineWidth = 1;
  for (let i = 1; i < 12; i++) {

    ctx.moveTo(stage.x + i * 50, stage.y);
    ctx.lineTo(stage.x + i * 50, stage.y + stage.h);

  }

  ctx.fillStyle = '#888';

  ctx.fillStyle = '#5a3a18';

  ctx.fillRect(stage.x + stage.w, stage.y, 22, 80);

  ctx.strokeStyle = '#d8b070';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(stage.x, stage.y + 15);
  ctx.lineTo(stage.x + stage.w, stage.y + 15);

}

function drawStageCave() {
  const sg = ctx.createLinearGradient(0, stage.y, 0, stage.y + stage.h);
  sg.addColorStop(0, '#8a8270');
  sg.addColorStop(0.5, '#5a5040');
  sg.addColorStop(1, '#2a2018');
  ctx.fillStyle = sg;
  ctx.fillRect(stage.x, stage.y, stage.w, stage.h);
  // コケ
  ctx.fillStyle = '#3a8030';
  ctx.fillRect(stage.x, stage.y, stage.w, 4);
  for (let i = 0; i < 12; i++) {
    ctx.fillRect(stage.x + i * 50 + 5, stage.y - 2, 12, 3);
  }
  // 下の小石
  ctx.fillStyle = '#4a4030';
  for (let i = 0; i < 10; i++) {
    ctx.fillRect(stage.x + 20 + i * 60, stage.y + stage.h - 6, 30, 3);
  }
}

function drawStageCastle() {
  const sg = ctx.createLinearGradient(0, stage.y, 0, stage.y + stage.h);
  sg.addColorStop(0, '#b0b0b0');
  sg.addColorStop(1, '#404040');
  ctx.fillStyle = sg;
  ctx.fillRect(stage.x, stage.y, stage.w, stage.h);
  // 上のクレネレーション
  ctx.fillStyle = '#909090';
  for (let i = 0; i < 12; i++) {
    ctx.fillRect(stage.x + i * 50, stage.y - 7, 28, 7);
  }
  // レンガ
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 13; c++) {
      ctx.strokeRect(stage.x + c * 50 + (r % 2) * 25 - 25, stage.y + 5 + r * 12, 50, 12);
    }
  }
}

let shake = 0;

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
    if (shake < 0.5) shake = 0;
  }

  // 背景（ステージごと）
  drawBackground();
  drawBgParticles();
  drawStagePlatform();

  // ファイター描画
  drawFighter(p2);
  drawFighter(p1);

  // シールドバブル
  [p1, p2].forEach(f => {
    if (f.shielding) {
      ctx.save();
      const meter = f.shieldMeter / 100;
      const r = (28 + 16 * meter) * f.size + Math.sin(performance.now() * 0.015) * 1.5;
      const cy = f.y - f.h / 2;
      const grad = ctx.createRadialGradient(f.x, cy, r * 0.3, f.x, cy, r);
      grad.addColorStop(0, 'rgba(180, 230, 255, 0.15)');
      grad.addColorStop(0.7, 'rgba(126, 200, 255, 0.45)');
      grad.addColorStop(1, 'rgba(126, 200, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(f.x, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.5 + meter * 0.4) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  });

  // 攻撃ヒットボックス（エフェクト）
  [p1, p2].forEach(f => {
    if (f.attackBox) {
      const a = f.attackBox;
      ctx.save();
      const alpha = Math.min(1, a.life / 8);
      ctx.globalAlpha = alpha * 0.7;
      const swingGrad = ctx.createRadialGradient(
        a.x + a.w/2, a.y + a.h/2, 5,
        a.x + a.w/2, a.y + a.h/2, a.w
      );
      swingGrad.addColorStop(0, a.strong ? '#ff4081' : '#ffe44d');
      swingGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = swingGrad;
      ctx.beginPath();
      ctx.ellipse(a.x + a.w/2, a.y + a.h/2, a.w/1.5, a.h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  // パーティクル
  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  // UI（ダメージ表示・残機）
  drawUI();

  // アナウンス
  if (announceTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, announceTimer / 30);
    ctx.fillStyle = '#ffe44d';
    ctx.strokeStyle = '#ff4081';
    ctx.lineWidth = 6;
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(announceText, W/2, H/2);
    ctx.fillText(announceText, W/2, H/2);
    ctx.restore();
  }
}

function drawFighter(f) {
  ctx.save();
  // 影
  if (f.onGround) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.ellipse(f.x, stage.y + 2, 22 * f.size, 5 * f.size, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 点滅（無敵中）
  if (f.flashTimer > 0 && Math.floor(f.flashTimer / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  ctx.translate(f.x, f.y);
  ctx.scale(f.facing * f.size, f.size);

  // 攻撃モーション：振り上げ
  let armAngle = 0;
  if (f.attackBox) {
    const t = 1 - (f.attackBox.life / (f.attackBox.strong ? 14 : 8));
    armAngle = Math.sin(t * Math.PI) * 1.2;
  }

  // 歩きで上下に揺れる
  const bob = f.onGround && Math.abs(f.vx) > 0.5 ? Math.sin(f.walkAnim) * 2 : 0;

  switch (f.type) {
    case 'astronaut': drawAstronaut(f, armAngle, bob); break;
    case 'alien':
    case 'alien_red': drawAlien(f, armAngle, bob); break;
    case 'robot':     drawRobot(f, armAngle, bob); break;
    case 'ghost':     drawGhost(f, armAngle, bob); break;
    case 'boss':      drawBoss(f, armAngle, bob); break;
    default:          drawAlien(f, armAngle, bob);
  }

  ctx.restore();
}

function drawAstronaut(f, armAngle, bob) {
  // 体（白い宇宙服）
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(-18, -50 + bob, 36, 38);
  // 胸の青パネル
  ctx.fillStyle = f.color;
  ctx.fillRect(-10, -42 + bob, 20, 14);
  ctx.fillStyle = '#ffe44d';
  ctx.fillRect(-6, -38 + bob, 4, 4);
  ctx.fillStyle = '#ff4081';
  ctx.fillRect(2, -38 + bob, 4, 4);

  // 足
  ctx.fillStyle = '#d0d0d0';
  ctx.fillRect(-15, -12 + bob, 12, 14);
  ctx.fillRect(3, -12 + bob, 12, 14);
  // ブーツ
  ctx.fillStyle = '#333';
  ctx.fillRect(-17, -2 + bob, 16, 4);
  ctx.fillRect(1, -2 + bob, 16, 4);

  // 腕
  ctx.save();
  ctx.translate(15, -45 + bob);
  ctx.rotate(-armAngle);
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(0, 0, 10, 22);
  // 手袋
  ctx.fillStyle = f.color;
  ctx.fillRect(-1, 18, 12, 8);
  ctx.restore();
  // 反対の腕
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(-25, -45 + bob, 10, 22);
  ctx.fillStyle = f.color;
  ctx.fillRect(-26, -27 + bob, 12, 8);

  // ヘルメット
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, -60 + bob, 22, 0, Math.PI * 2);
  ctx.fill();
  // バイザー（ガラス）
  const visorGrad = ctx.createLinearGradient(0, -68 + bob, 0, -52 + bob);
  visorGrad.addColorStop(0, '#4a90ff');
  visorGrad.addColorStop(1, '#001a4d');
  ctx.fillStyle = visorGrad;
  ctx.beginPath();
  ctx.ellipse(2, -60 + bob, 14, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  // バイザーの反射
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(6, -64 + bob, 4, 3, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // ヘルメットのアンテナ
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-15, -75 + bob);
  ctx.lineTo(-18, -85 + bob);
  ctx.stroke();
  ctx.fillStyle = '#ff4081';
  ctx.beginPath();
  ctx.arc(-18, -86 + bob, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawAlien(f, armAngle, bob) {
  // 体（緑のぷにぷに）
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(0, -30 + bob, 22, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  // お腹の模様（薄い緑）
  ctx.fillStyle = '#b8f0a0';
  ctx.beginPath();
  ctx.ellipse(0, -25 + bob, 12, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // 足（短い）
  ctx.fillStyle = f.color;
  ctx.fillRect(-12, -8 + bob, 8, 10);
  ctx.fillRect(4, -8 + bob, 8, 10);
  ctx.fillStyle = '#5da043';
  ctx.fillRect(-13, 0 + bob, 10, 3);
  ctx.fillRect(3, 0 + bob, 10, 3);

  // 腕（触手っぽい）
  ctx.save();
  ctx.translate(18, -38 + bob);
  ctx.rotate(-armAngle);
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(8, 8, 6, 16, 0.3, 0, Math.PI * 2);
  ctx.fill();
  // 手
  ctx.fillStyle = '#b8f0a0';
  ctx.beginPath();
  ctx.arc(13, 22, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // 反対腕
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(-23, -28 + bob, 6, 14, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#b8f0a0';
  ctx.beginPath();
  ctx.arc(-26, -16 + bob, 5, 0, Math.PI * 2);
  ctx.fill();

  // 頭
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(0, -58 + bob, 20, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // 目（大きいキラキラ）
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, -58 + bob, 6, 0, Math.PI * 2);
  ctx.arc(7, -58 + bob, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, -57 + bob, 3, 0, Math.PI * 2);
  ctx.arc(8, -57 + bob, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, -58 + bob, 1.2, 0, Math.PI * 2);
  ctx.arc(9, -58 + bob, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // 口（にっこり）
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -50 + bob, 4, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // アンテナ
  ctx.strokeStyle = f.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-8, -73 + bob);
  ctx.lineTo(-10, -85 + bob);
  ctx.moveTo(8, -73 + bob);
  ctx.lineTo(10, -85 + bob);
  ctx.stroke();
  // アンテナの先っぽ
  ctx.fillStyle = '#ffe44d';
  ctx.beginPath();
  ctx.arc(-10, -86 + bob, 3.5, 0, Math.PI * 2);
  ctx.arc(10, -86 + bob, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawRobot(f, armAngle, bob) {
  // 胴体
  ctx.fillStyle = f.color;
  ctx.fillRect(-20, -50 + bob, 40, 38);
  // 胸の赤いランプ
  ctx.fillStyle = '#222';
  ctx.fillRect(-10, -42 + bob, 20, 14);
  ctx.fillStyle = '#ff4081';
  ctx.beginPath();
  ctx.arc(0, -35 + bob, 4, 0, Math.PI * 2);
  ctx.fill();
  // 足（メカ脚）
  ctx.fillStyle = '#5a6680';
  ctx.fillRect(-16, -12 + bob, 12, 14);
  ctx.fillRect(4, -12 + bob, 12, 14);
  ctx.fillStyle = '#222';
  ctx.fillRect(-18, -2 + bob, 16, 4);
  ctx.fillRect(2, -2 + bob, 16, 4);

  // 腕
  ctx.save();
  ctx.translate(18, -45 + bob);
  ctx.rotate(-armAngle);
  ctx.fillStyle = f.color;
  ctx.fillRect(0, 0, 10, 22);
  ctx.fillStyle = '#5a6680';
  ctx.fillRect(-2, 18, 14, 8);
  ctx.restore();
  // 反対の腕
  ctx.fillStyle = f.color;
  ctx.fillRect(-28, -45 + bob, 10, 22);
  ctx.fillStyle = '#5a6680';
  ctx.fillRect(-30, -27 + bob, 14, 8);

  // 頭（四角）
  ctx.fillStyle = f.color;
  ctx.fillRect(-18, -76 + bob, 36, 26);
  // 目（赤いLED）
  ctx.fillStyle = '#222';
  ctx.fillRect(-14, -68 + bob, 28, 10);
  ctx.fillStyle = '#ff4081';
  ctx.fillRect(-11, -65 + bob, 6, 4);
  ctx.fillRect(5, -65 + bob, 6, 4);
  // アンテナ
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -76 + bob);
  ctx.lineTo(0, -88 + bob);
  ctx.stroke();
  ctx.fillStyle = '#ffe44d';
  ctx.beginPath();
  ctx.arc(0, -90 + bob, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawGhost(f, armAngle, bob) {
  // 全体ぼんやり
  ctx.save();
  ctx.globalAlpha = 0.85;
  // 浮遊：bob 強め
  const float = Math.sin(f.walkAnim * 0.5 + performance.now() * 0.005) * 3;

  // 体（ゆらゆらした下端）
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.moveTo(-22, -10 + float);
  ctx.quadraticCurveTo(-26, -50 + float, 0, -60 + float);
  ctx.quadraticCurveTo(26, -50 + float, 22, -10 + float);
  // ギザギザの裾
  ctx.lineTo(16, 2 + float);
  ctx.lineTo(8, -6 + float);
  ctx.lineTo(0, 2 + float);
  ctx.lineTo(-8, -6 + float);
  ctx.lineTo(-16, 2 + float);
  ctx.closePath();
  ctx.fill();

  // 目（黒い穴）
  ctx.fillStyle = '#1a0030';
  ctx.beginPath();
  ctx.ellipse(-7, -38 + float, 4, 6, 0, 0, Math.PI * 2);
  ctx.ellipse(7, -38 + float, 4, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // 口
  ctx.beginPath();
  ctx.ellipse(0, -22 + float, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // 腕（ゆらゆら触手）
  ctx.fillStyle = f.color;
  ctx.save();
  ctx.translate(20, -40 + float);
  ctx.rotate(-armAngle);
  ctx.beginPath();
  ctx.ellipse(8, 12, 6, 16, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.ellipse(-22, -28 + float, 6, 12, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBoss(f, armAngle, bob) {
  // ボディ（ローブ風）
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.moveTo(-26, -10 + bob);
  ctx.lineTo(-22, -55 + bob);
  ctx.lineTo(22, -55 + bob);
  ctx.lineTo(26, -10 + bob);
  ctx.lineTo(20, -2 + bob);
  ctx.lineTo(-20, -2 + bob);
  ctx.closePath();
  ctx.fill();
  // ローブの黒い縁
  ctx.fillStyle = '#3a0020';
  ctx.fillRect(-26, -12 + bob, 52, 4);

  // 胸の宝石
  ctx.fillStyle = '#ffe44d';
  ctx.beginPath();
  ctx.moveTo(0, -42 + bob);
  ctx.lineTo(-6, -35 + bob);
  ctx.lineTo(0, -28 + bob);
  ctx.lineTo(6, -35 + bob);
  ctx.closePath();
  ctx.fill();

  // 腕
  ctx.save();
  ctx.translate(22, -50 + bob);
  ctx.rotate(-armAngle);
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(8, 14, 8, 18, 0.2, 0, Math.PI * 2);
  ctx.fill();
  // つめ
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(12, 28); ctx.lineTo(18, 36); ctx.lineTo(8, 32); ctx.closePath();
  ctx.fill();
  ctx.restore();
  // 反対腕
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(-26, -36 + bob, 7, 16, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // 頭
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(0, -68 + bob, 20, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // つの
  ctx.fillStyle = '#3a0020';
  ctx.beginPath();
  ctx.moveTo(-14, -78 + bob); ctx.lineTo(-22, -98 + bob); ctx.lineTo(-8, -82 + bob); ctx.closePath();
  ctx.moveTo(14, -78 + bob); ctx.lineTo(22, -98 + bob); ctx.lineTo(8, -82 + bob); ctx.closePath();
  ctx.fill();

  // 光る目
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-7, -68 + bob, 5, 0, Math.PI * 2);
  ctx.arc(7, -68 + bob, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff4081';
  ctx.beginPath();
  ctx.arc(-7, -68 + bob, 3, 0, Math.PI * 2);
  ctx.arc(7, -68 + bob, 3, 0, Math.PI * 2);
  ctx.fill();
  // 邪悪な口
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-6, -56 + bob);
  ctx.lineTo(-2, -58 + bob);
  ctx.lineTo(2, -56 + bob);
  ctx.lineTo(6, -58 + bob);
  ctx.stroke();
}

function drawUI() {
  // P1 パネル
  drawPlayerPanel(30, H - 105, p1, '1Pくん');
  // P2 パネル
  drawPlayerPanel(W - 230, H - 105, p2, 'てき');

  // ウェーブ表示（中央うえ）
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 30, 0.7)';
  ctx.strokeStyle = '#ffe44d';
  ctx.lineWidth = 3;
  ctx.fillRect(W/2 - 110, 12, 220, 50);
  ctx.strokeRect(W/2 - 110, 12, 220, 50);
  ctx.fillStyle = '#ffe44d';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('WAVE ' + wave + '  -  ' + currentStage.name, W/2, 30);
  // たおした数
  ctx.fillStyle = '#aaccff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('たおした: ' + score, W/2, 50);
  ctx.restore();
}

function drawPlayerPanel(x, y, f, label) {
  const PH = 90; // パネル高さ（シールドゲージ分すこし広く）
  // 背景
  ctx.fillStyle = 'rgba(0, 0, 30, 0.7)';
  ctx.fillRect(x, y, 200, PH);
  ctx.strokeStyle = f.color;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, 200, PH);

  // 名前
  ctx.fillStyle = f.color;
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(label + ': ' + f.name, x + 10, y + 22);

  // ダメージ％（多いほど赤に）
  const dmgColor = f.damage < 50 ? '#ffffff' : f.damage < 100 ? '#ffe44d' : f.damage < 150 ? '#ff8c00' : '#ff4081';
  ctx.fillStyle = dmgColor;
  ctx.font = 'bold 32px sans-serif';
  ctx.fillText(Math.floor(f.damage) + '%', x + 10, y + 55);

  // 残機（ハート）— 最大5まで表示
  const maxHearts = Math.max(3, f.lives);
  for (let i = 0; i < maxHearts; i++) {
    const hx = x + 110 + i * 18;
    const hy = y + 50;
    drawHeart(hx, hy, i < f.lives ? f.color : '#333');
  }

  // シールドゲージ
  ctx.fillStyle = '#aaccff';
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText('SHIELD', x + 10, y + 76);
  const sBarX = x + 65, sBarY = y + 68, sBarW = 125, sBarH = 9;
  ctx.fillStyle = '#222';
  ctx.fillRect(sBarX, sBarY, sBarW, sBarH);
  const meterPct = f.shieldMeter / 100;
  let barColor;
  if (f.shieldBroken > 0) barColor = '#ff4081';
  else if (f.shielding) barColor = '#ffffff';
  else barColor = '#7ec8ff';
  ctx.fillStyle = barColor;
  ctx.fillRect(sBarX, sBarY, sBarW * meterPct, sBarH);
  ctx.strokeStyle = '#5a7090';
  ctx.lineWidth = 1;
  ctx.strokeRect(sBarX, sBarY, sBarW, sBarH);
}

function drawHeart(cx, cy, color) {
  const s = 0.7; // 少し小さめ
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy + 8 * s);
  ctx.bezierCurveTo(cx, cy + 4 * s, cx - 10 * s, cy - 4 * s, cx - 10 * s, cy);
  ctx.bezierCurveTo(cx - 10 * s, cy - 6 * s, cx - 4 * s, cy - 8 * s, cx, cy - 2 * s);
  ctx.bezierCurveTo(cx + 4 * s, cy - 8 * s, cx + 10 * s, cy - 6 * s, cx + 10 * s, cy);
  ctx.bezierCurveTo(cx + 10 * s, cy - 4 * s, cx, cy + 4 * s, cx, cy + 8 * s);
  ctx.fill();
}

// メインループ
function loop() {
  update();
  draw();
  if (gameState === 'over') {
    showOverlay('ゲームオーバー...', 'WAVE ' + wave + ' で やられた！ たおした数: ' + score);
  }
  requestAnimationFrame(loop);
}

// オーバーレイ
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const startBtn = document.getElementById('startBtn');

function showOverlay(title, sub) {
  if (!overlay.classList.contains('hidden')) return; // 既に出ていれば何もしない
  titleEl.textContent = title;
  subtitleEl.textContent = sub;
  startBtn.textContent = 'もういちど！';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click', () => {
  resetGame();
  overlay.classList.add('hidden');
});

// 初期化
resetGame();
gameState = 'title';

loop();
</script>
